<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardio-Oncology Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#17222b;--mute:#5a6b78;--line:#d8e0e5;--acc:#0e6b73;--accbg:#e1f1f2;--warn:#a4430c;--warnbg:#fbeadd;--bad:#a3182f;--badbg:#fbe3e7;--ok:#1d6b3a;--okbg:#e0f2e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--card:#18232b;--ink:#e6edf1;--mute:#97a8b4;--line:#2b3a45;--acc:#5cc3cc;--accbg:#143238;--warn:#f0a370;--warnbg:#3a2515;--bad:#ff8fa1;--badbg:#3d1a22;--ok:#7fd49c;--okbg:#17321f}}
:root[data-theme="dark"]{--bg:#0f171d;--card:#18232b;--ink:#e6edf1;--mute:#97a8b4;--line:#2b3a45;--acc:#5cc3cc;--accbg:#143238;--warn:#f0a370;--warnbg:#3a2515;--bad:#ff8fa1;--badbg:#3d1a22;--ok:#7fd49c;--okbg:#17321f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:18px 16px 8px;max-width:820px;margin:0 auto}
h1{font:600 26px/1.15 Fraunces,Georgia,serif;margin:0 0 4px}
h2{font:600 19px/1.2 Fraunces,Georgia,serif;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav div{max-width:820px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px}
nav button{flex:none;border:0;background:none;color:var(--mute);font:500 14px inherit;font-family:inherit;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accbg);color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}
label.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
input[type=checkbox]{margin-top:3px;accent-color:var(--acc)}
input[type=number],select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accbg);color:var(--acc);margin:2px 4px 2px 0}
.pill.w{background:var(--warnbg);color:var(--warn)}.pill.b{background:var(--badbg);color:var(--bad)}.pill.o{background:var(--okbg);color:var(--ok)}
.box{border-left:4px solid var(--acc);background:var(--accbg);padding:10px 12px;border-radius:6px;margin:10px 0}
.box.w{border-color:var(--warn);background:var(--warnbg)}.box.b{border-color:var(--bad);background:var(--badbg)}.box.o{border-color:var(--ok);background:var(--okbg)}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sc{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.foot{font-size:12px;color:var(--mute);margin-top:24px}
</style></head><body>
<header><h1>Cardio-Oncology Guide</h1>
<p class="sub">Assessment, diagnosis and treatment of cardiovascular conditions in cancer. Source: Ch. 74, pp. 2103–2119.</p></header>
<nav><div role="tablist" id="tabs"></div></nav>
<main id="view"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";

/* Table 74-1 / 74-2 data */
const TOX={
"Heart failure / LV dysfunction":["Anthracyclines","Mitoxantrone","Cyclophosphamide","Ifosfamide","Docetaxel","Paclitaxel","Bevacizumab","Trastuzumab","Sunitinib","Dasatinib","Lapatinib","Imatinib","Bortezomib","Carfilzomib","Clofarabine","Pembrolizumab (ICI)"],
"Ischemia / MI":["Bevacizumab","Capecitabine","Docetaxel","Erlotinib","5-Fluorouracil","Paclitaxel","Sorafenib","Sunitinib","Lapatinib","Pazopanib","Cytarabine","Ifosfamide","Cisplatin","Atezolizumab (ICI)"],
"Hypertension":["Bevacizumab","Sorafenib","Sunitinib","Imatinib","Dasatinib","Mitoxantrone","Cyclosporine"],
"Hypotension / infusion reaction":["Alemtuzumab","All-trans-retinoic acid","Decitabine","Denileukin","Etoposide","Interferon-α","Interleukin-2","Paclitaxel","Rituximab","Cetuximab"],
"Bradycardia / AV block":["Paclitaxel","Thalidomide","Bortezomib","Cisplatin","Octreotide"],
"QT prolongation / torsade":["Arsenic trioxide","Dasatinib","Lapatinib","Nilotinib","Vorinostat","Pazopanib"],
"Atrial fibrillation":["Ibrutinib","5-FU","Gemcitabine","Docetaxel","Alemtuzumab"],
"Thromboembolism":["Bevacizumab","Cisplatin","Erlotinib","Lenalidomide","Sunitinib","Thalidomide","Vorinostat","Pomalidomide","Ponatinib","Tamoxifen"],
"Pericarditis / effusion":["Doxorubicin","Cyclophosphamide","Busulfan","Clofarabine","Dasatinib","Imatinib","Ipilimumab (ICI)","All-trans-retinoic acid"],
"Myocarditis (immune checkpoint)":["Ipilimumab (ICI)","Nivolumab (ICI)","Avelumab (ICI)","Durvalumab (ICI)","CAR-T (cytokine release)"]};
const DRUGS=[...new Set(Object.values(TOX).flat())].sort();
const RF=[["Older or younger age",1],["Female sex",1],["Pre-existing hypertension",1],["Pre-existing CAD",1],["Metabolic syndrome / diabetes",1],["Prior chest radiation",2],["Prior anthracycline",2],["Anthracycline + trastuzumab together",2],["Pre-existing cardiomyopathy / HF",3],["Baseline LVEF low or borderline",2],["Cumulative anthracycline dose high / bolus IV",1]];

/* Diagnose */
const DX={
"Dyspnea, edema, fatigue":{d:["Chemotherapy cardiomyopathy (anthracyclines, trastuzumab, TKIs, alkylators)","Radiation heart disease","Myocarditis (checkpoint inhibitors)","Pericardial effusion / constriction","Pulmonary embolism","Anemia, sepsis, capillary leak, cachexia, thyroid disease"],t:["Examination: JVP, S3, volume status","ECG, chest radiograph","Echocardiography with LVEF and global longitudinal strain (3D echo preferred)","Troponin I and BNP (BNP may be falsely high)","Hemoglobin, lipids, glucose, thyroid"],n:"Echo is the mainstay. Strain change >10% from baseline predicts later LVEF fall; >15% is clinically significant."},
"Chest pain":{d:["Fluoropyrimidine vasospasm (5-FU, capecitabine)","Acute coronary syndrome (bevacizumab, cisplatin, TKIs)","Pericarditis (radiation, ICIs)","Pulmonary embolism","Radiation-accelerated CAD (latency ≥10 years)","Pericardial tumor involvement"],t:["12-lead ECG","Serial troponin","Echocardiography","CT angiography if PE suspected","Platelet count and brain imaging before antithrombotics"],n:"Chest pain often needs chemotherapy interruption. 5-FU ischemia usually reverses on stopping and re-challenge often reproduces it."},
"Hypertension":{d:["VEGF-pathway drugs (bevacizumab, sorafenib, sunitinib)","Cyclosporine with steroids (>50%)","Pheochromocytoma (paroxysmal)","Hyperthyroidism / thyroid tumors"],t:["Repeat BP measurement and home log","Creatinine, urine protein","Plasma/urine catecholamines if episodic","Echo if sustained"],n:"Sorafenib raises BP in 17–43%, sunitinib 5–24%, bevacizumab 4–35%."},
"Hypotension / shock":{d:["Infusion reaction (rituximab, cetuximab, alemtuzumab)","Cytokine release syndrome (CAR-T)","IL-2 vascular leak","Retinoic acid syndrome","Sepsis, dehydration, malnutrition","Tamponade"],t:["Vitals and fluids status","Echocardiography","Cultures and lactate","Review infusion timing and agent"],n:"Retinoic acid syndrome affects ~26% within 21 days: fever, dyspnea, hypotension, pleural and pericardial effusion."},
"Palpitations, syncope":{d:["Atrial fibrillation (ibrutinib, 5-FU, gemcitabine, docetaxel)","Supraventricular tachycardia from lung/chest tumor or after lung resection","QT prolongation and torsade","Brady-arrhythmia / AV block (paclitaxel, thalidomide)","Electrolyte disorder, hypoxia, thyrotoxicosis","Intracardiac mass or myxoma"],t:["12-lead ECG, telemetry or Holter","K, Mg, Ca, thyroid","Serial QTc on arsenic trioxide, dasatinib, lapatinib, nilotinib, vorinostat","Echocardiography"],n:"Atrial premature complexes may herald early anthracycline toxicity. Check QT-prolonging co-medications."},
"Leg swelling, pleuritic pain, hypoxia":{d:["Deep venous thrombosis","Pulmonary embolism","Catheter-related thrombus","Marantic endocarditis, DIC"],t:["Compression ultrasound","CT pulmonary angiography","D-dimer in context","Echo for RV strain; TEE for catheter thrombus"],n:"VTE occurs in 5–7% of cancer patients vs ~0.1% in the general population. PE in-hospital mortality 20–30%."},
"Pericardial effusion / tamponade":{d:["Malignant (lung, breast, melanoma, lymphoma)","Radiation pericarditis","Drug-related (busulfan, cyclophosphamide, doxorubicin, dasatinib)","Hypothyroidism after mantle RT","Primary mesothelioma or angiosarcoma"],t:["Echocardiography first","CT or MRI for constriction and masses","Pericardiocentesis with cytology","TSH"],n:"A normal ECG does not exclude radiation pericarditis. Cytology can be negative in malignant effusion."},
"Years after chest radiation":{d:["Pericardial constriction (up to 20%)","Valve fibrosis and calcification (left-sided)","CAD, ostial and proximal","Conduction disease (PR prolongation, AV block)","Restrictive myocardial fibrosis","Carotid disease"],t:["Echocardiography","Stress echo / perfusion / calcium score / CCTA","Carotid ultrasound","CMR for constriction"],n:"Worst when dose >35 Gy, young age at exposure, anthracycline co-exposure, or Hodgkin / left-breast cancer."},
"Embolism, murmur, constitutional symptoms":{d:["Left atrial myxoma (S1 loud/split, 'tumor plop')","Right atrial tumor","Non-bacterial thrombotic endocarditis","Metastatic cardiac tumor"],t:["Transthoracic then transesophageal echo","CT / MRI","Full blood count, ESR, immunoglobulins"],n:"Myxoma triad: constitutional, embolic and obstructive features. Symptoms change with posture."}};

/* Treat */
const TX={
"Heart failure / LV dysfunction":{k:["Treat as non-cancer HF per ACC/AHA or ESC guidelines; start early (within 2 months of anthracycline end gives better recovery).","ACE inhibitor (or ARB) plus beta-blocker are the cornerstone. Hydralazine-nitrate if renal failure or in Black patients. MRA reasonable if NYHA >I and LVEF ≤35%.","Sacubitril/valsartan and SGLT2 inhibitors are not yet studied in chemo-cardiomyopathy.","Treat risk factors aggressively: hypertension, ischemia, anemia, thyroid.","Check drug interactions between HF drugs and anticancer agents.","ICD if LVEF <30–35%, NYHA II–III, on optimal therapy, with >1 year expected survival; CRT similarly.","Mechanical support or transplant if refractory; acute support in fulminant myopericarditis.","Educate patient and family on fluid overload; discuss end-of-life wishes. Cancer does not mean CV disease should be under-treated."],p:["Continuous infusion or liposomal doxorubicin; epirubicin or idarubicin as less cardiotoxic derivatives","Dexrazoxane (Top 2β inhibitor) only for metastatic breast cancer after >300 mg/m² doxorubicin (ASCO)","Beta-blocker, ACE-I or ARB (carvedilol, enalapril, valsartan trials: OVERCOME, PRADA)","Separate trastuzumab from anthracycline"]},
"Myocardial ischemia / ACS":{k:["Stop or interrupt the suspected agent; serial ECG and enzymes.","STEMI or Q-wave MI: manage per ACC/AHA or ESC guidelines.","NSTE-ACS: weigh bleeding vs thrombosis. Thrombocytopenia, brain metastases, active bleeding, planned surgery or marrow transplant may contraindicate antiplatelet/anticoagulant therapy.","5-FU / capecitabine: ischemia reverses after stopping; nitrates and calcium-channel blockers may allow continuation if the therapy is crucial.","Re-challenge with 5-FU frequently reproduces ischemia.","Prior mediastinal radiation: expect premature CAD and prefer aggressive risk-factor control."]},
"Hypertension (anti-angiogenic)":{k:["Treat promptly to prevent progression to heart failure and stopped cancer therapy.","ACE inhibitor first-line (reduces proteinuria and PAI-1; may raise bradykinin and NO).","Nebivolol (beta-1 block plus NO vasodilation); phosphodiesterase inhibitors and nitrates are options.","Calcium-channel blockers for cyclosporine hypertension.","Pheochromocytoma: phenoxybenzamine first, then beta-blocker, before anesthesia."]},
"Hypotension / infusion reaction":{k:["Rituximab and cetuximab reactions: IV fluids, vasopressors, bronchodilators, diphenhydramine, acetaminophen; cetuximab severe reaction ~3%.","Interferon-α symptoms in first 2–8 h; IL-2 vascular leak may need pressors and ventilation.","CRS from CAR-T: tocilizumab (anti IL-6 receptor).","Correct dehydration and malnutrition; evaluate sepsis."]},
"Arrhythmias":{k:["First find the cause: correct electrolytes (K, Mg, Ca), hypoxia, thyroid, infection; remove arrhythmogenic agent if possible.","AF with ibrutinib: dose reduction and/or anticoagulation in combination.","QT prolongation: serial ECGs, stop other QT-prolonging drugs; monitor closely on arsenic trioxide.","Thalidomide bradycardia: adjust dose; pacing occasionally needed.","Paclitaxel or octreotide AV block is usually transient.","Standard drugs and devices should not be denied if survival expected >1 year with good function."]},
"Venous / arterial thromboembolism":{k:["Preferred: LMWH over warfarin for acute cancer VTE (fewer recurrences; easier dosing, fewer interactions).","NOACs (dabigatran, rivaroxaban, edoxaban, apixaban) appear effective and safe in trials; avoid apixaban with primary brain tumors, brain metastases or acute leukemia.","LMWH preferred with high interaction risk or upper GI surgery.","Remove indwelling catheter when no longer needed.","IVC filter for recurrent PE with high bleeding risk.","Prophylaxis: ASCO 2013 recommends Khorana score at chemo start; PROTECHT and SAVE-ONCO support prophylaxis in high risk.","Ponatinib: black-box warning for arterial thrombosis."]},
"Radiation pericarditis / constriction":{k:["Pericarditis without tamponade: NSAIDs.","Pericardiocentesis if large effusion with hemodynamic compromise.","Exclude infection, tumor invasion/recurrence and hypothyroidism for recurrent effusion.","Constriction needs pericardiectomy, but operative mortality is ~21% and 5-year survival ~1% in radiation cases (fibrosis)."]},
"Checkpoint-inhibitor cardiotoxicity":{k:["Ipilimumab (CTLA-4): pericarditis, myocarditis. Nivolumab (PD-1): myocarditis, arrhythmia. Pembrolizumab: HF. Atezolizumab (PD-L1): MI. Avelumab, durvalumab: myocarditis.","Chapter describes immune activation against self; close cardiology–oncology collaboration is required.","Management details are not given in this chapter; follow current society guidance."]},
"Cardiac myxoma":{k:["Surgical resection is the only effective therapy.","Left atrial: excise full thickness of interatrial septum at fossa ovalis; patch with knitted Dacron if large defect.","Induce cardioplegia before manipulation to limit tumor fragmentation.","Familial forms (~5%, Carney complex) need family evaluation."]}};

/* Table 74-5/6 */
const PRE=["Careful CV risk evaluation for every patient before chemo or radiation.","Optimize pre-existing disease (cardiomyopathy, arrhythmia, CAD, hypertension); cardio-oncology consult preferred.","Baseline transthoracic echo and 12-lead ECG before potentially cardiotoxic therapy.","High risk (cardiomyopathy, HF, CAD, hypertension, prior RT or anthracycline, age >60–65): consider cardioprotective agents; ACE-I first-line (BP >140/85), also ARBs, carvedilol, nebivolol.","Dexrazoxane: metastatic breast cancer after >300 mg/m² doxorubicin.","Low or borderline LVEF: consider a non-anthracycline regimen."];

let tab="assess",st={drugs:new Set(),rf:new Set(),dx:Object.keys(DX)[0],tx:Object.keys(TX)[0],q:""};
const TABS=[["assess","Assess"],["lvef","LVEF check"],["dx","Diagnose"],["tx","Treat"],["mon","Monitor"],["ref","Reference"]];
function nav(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k==tab}" data-t="${k}">${l}</button>`).join("");
$("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function chips(items,key,cur){return `<div class="chips">`+items.map(i=>`<button aria-pressed="${i==cur}" data-k="${key}" data-v="${esc(i)}">${esc(i)}</button>`).join("")+"</div>"}

function assess(){
const sel=[...st.drugs],prof={};
sel.forEach(d=>Object.entries(TOX).forEach(([k,v])=>{if(v.includes(d))(prof[k]=prof[k]||[]).push(d)}));
let score=0;st.rf.forEach(i=>score+=RF[i][1]);
const lvl=score>=6?["High","b"]:score>=3?["Intermediate","w"]:["Lower","o"];
let h=`<div class="card"><h2>1. Planned or current therapy</h2><div class="grid">`+DRUGS.map(d=>`<label class="ck"><input type="checkbox" data-d="${esc(d)}" ${st.drugs.has(d)?"checked":""}>${esc(d)}</label>`).join("")+`</div></div>`;
h+=`<div class="card"><h2>2. Patient risk factors</h2><div class="grid">`+RF.map((r,i)=>`<label class="ck"><input type="checkbox" data-r="${i}" ${st.rf.has(i)?"checked":""}>${r[0]}</label>`).join("")+`</div></div>`;
h+=`<div class="card"><h2>Result</h2><p>Risk-factor burden: <span class="pill ${lvl[1]}">${lvl[0]} (score ${score})</span></p><p class="sub">Simple tally of the chapter’s listed risk factors, for orientation only. It is not a validated score.</p>`;
if(sel.length){h+="<h3>Expected cardiovascular effects</h3>"+Object.entries(prof).map(([k,v])=>`<div class="box"><b>${k}</b><br>${v.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`).join("")}else h+=`<p>Select therapies above to see their cardiovascular effects.</p>`;
const anth=["Anthracyclines","Doxorubicin","Mitoxantrone"].some(x=>st.drugs.has(x)),tz=st.drugs.has("Trastuzumab");
if(anth&&tz)h+=`<div class="box b"><b>Anthracycline with trastuzumab.</b> Concomitant use caused HF in 18% of early trial patients. Segregate the two agents.</div>`;
if(st.rf.has(5)||st.rf.has(6)||st.rf.has(8))h+=`<div class="box w">High-risk features present: consider cardioprotection and a cardio-oncology consult.</div>`;
h+="<h3>Before starting therapy</h3>"+li(PRE)+"</div>";return h}

function lvef(){return `<div class="card"><h2>LVEF and strain check</h2><p class="sub">Enter baseline and current values. Same method and operator preferred; 3D echo or strain is recommended by ASE.</p>
<div class="row"><div><label>Baseline LVEF %<input type="number" id="b" min="10" max="80" value="60"></label></div><div><label>Current LVEF %<input type="number" id="c" min="10" max="80" value="52"></label></div></div>
<div class="row" style="margin-top:8px"><div><label>Baseline GLS % (optional, magnitude)<input type="number" id="gb" step="0.1" placeholder="22.6"></label></div><div><label>Current GLS % (optional)<input type="number" id="gc" step="0.1" placeholder="14.4"></label></div></div>
<div class="row" style="margin-top:8px"><div><label><input type="checkbox" id="sx"> Symptoms of heart failure</label></div></div><div id="lr"></div></div>`}
function lvefCalc(){
const b=+$("#b").value,c=+$("#c").value,sx=$("#sx").checked,gb=+$("#gb").value,gc=+$("#gc").value,dp=b-c,rel=b?dp/b*100:0;let o="";
const crit=[];
if(dp>10&&c<53)crit.push("ASE: CTRCD (fall >10 points to <53%)");
if(dp>=10&&c<50)crit.push("ESMO: CTRCD (fall ≥10% to <50%)");
if(dp>=5&&c<55&&sx)crit.push("Trial definition: ≥5% fall to <55% with symptoms");
if(dp>=10&&c<55&&!sx)crit.push("Trial definition: ≥10% fall to <55% without symptoms");
o+=`<p>LVEF change: <b>${dp.toFixed(0)} points</b> (${rel.toFixed(0)}% relative)</p>`;
o+=crit.length?`<div class="box b"><b>Meets cardiotoxicity criteria</b>${li(crit)}</div>`:`<div class="box o">No cardiotoxicity definition met.</div>`;
const g=c>=50?(dp>=15?"w":"o"):c>=40?"w":"b";
let a="";
if(c<40)a="LVEF <40%: stop chemotherapy, discuss alternatives, treat LV dysfunction with guideline-based HF therapy.";
else if(c<50)a="LVEF <50%: reassess in 3 weeks. If confirmed, hold chemotherapy, consider LV dysfunction work-up and frequent clinical and echo checks.";
else if(dp>=15)a="LVEF fall ≥15% from baseline with normal function (≥50%) is not by itself an indication to stop chemotherapy; keep surveillance close.";
else a="Continue planned surveillance.";
o+=`<div class="box ${g}"><b>Action (ESMO-based, Table 74-6)</b><br>${a}</div>`;
if(c>=50&&c<=100&&!sx&&dp>=10)o+=`<div class="box">Aggressive ACE-I and beta-blocker treatment is mandatory in asymptomatic LV dysfunction after anthracycline, especially if survival is long.</div>`;
if(gb&&gc){const r=(gb-gc)/gb*100;o+=`<div class="box ${r>15?"b":r>10?"w":"o"}"><b>GLS fall ${r.toFixed(0)}%.</b> ${r>15?"Clinically significant (>15%).":r>10?"Over 10%: predictive of later LVEF decline.":"Within 10%."}</div>`}
$("#lr").innerHTML=o}

function dxv(){const x=DX[st.dx];return `<div class="card"><h2>Presenting problem</h2>${chips(Object.keys(DX),"dx",st.dx)}</div>
<div class="card"><h2>${st.dx}</h2><h3>Think of</h3>${li(x.d)}<h3>Work-up</h3>${li(x.t)}<div class="box">${x.n}</div></div>`}
function txv(){const x=TX[st.tx];let h=`<div class="card"><h2>Condition</h2>${chips(Object.keys(TX),"tx",st.tx)}</div><div class="card"><h2>${st.tx}</h2>${li(x.k)}`;
if(x.p)h+="<h3>Prevention</h3>"+li(x.p);return h+"</div>"}
function mon(){return `<div class="card"><h2>During chemotherapy</h2>${li(["Metastatic disease: LVEF at baseline, then infrequently if asymptomatic.","Serial cardiac function at baseline, 3, 6 and 9 months, then 12 and 18 months after starting.","LVEF fall ≥15% with normal function: not an indication to stop.","LVEF <40%: stop. LVEF <50%: reassess in 3 weeks, hold if confirmed.","Trastuzumab without anthracycline: can continue if asymptomatic and LVEF stays ≥40%."])}</div>
<div class="card"><h2>Cardio-oncology echo protocol (Table 74-4)</h2>${li(["Standard TTE per ASE/EAE; 3D LVEF preferred.","2D strain from apical 3-, 4- and 2-chamber views, ≥3 cycles, frame rate 40–90/s or ≥40% of HR.","Report GLS as bull’s-eye plot; avoid ectopy and breathing translation.","Record timing relative to infusion, BP, HR, machine and software.","Without GLS: medial and lateral s′ and MAPSE; RV: TAPSE, s′, FAC."])}</div>
<div class="card"><h2>After chest radiation (Fig. 74-7)</h2>${li(["Baseline pre-radiation echo.","Yearly targeted history and examination; screen and correct modifiable risk factors.","Screening echo at 5 years if high risk (>35 Gy and/or multiple risk factors), at 10 years for others.","Functional stress test, perfusion imaging, calcium score or CCTA 5–10 years after in high-risk patients.","New murmur → echo. HF symptoms → echo. Angina → stress test. Neurologic symptoms → carotid ultrasound. Suspected constriction → CMR.","Re-assess every 5 years."])}</div>
<div class="card"><h2>Survivorship</h2><p>Cancer therapy is a risk factor for later heart failure, hypertension, ischemic and valvular disease. Follow-up should include primary and secondary prevention, with early detection of CV disease.</p></div>`}

function ref(){const q=st.q.toLowerCase();
const rows=Object.entries(TOX).map(([k,v])=>[k,v.filter(d=>!q||d.toLowerCase().includes(q)||k.toLowerCase().includes(q))]).filter(r=>r[1].length);
return `<div class="card"><h2>Drug–toxicity lookup</h2><input type="number" style="display:none"><input id="q" type="text" placeholder="Search a drug or effect" value="${esc(st.q)}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit">
<div class="sc"><table><tr><th>Effect</th><th>Agents</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1].map(d=>`<span class="pill">${esc(d)}</span>`).join("")}</td></tr>`).join("")}</table></div></div>

function render(){nav();const v=$("#view");
v.innerHTML={assess,lvef,dx:dxv,tx:txv,mon,ref}[tab]()+`<p class="foot">Educational decision support based on one textbook chapter. It does not replace clinical judgment or current guidelines.</p>`;
